[workspace]
resolver = "3"
members = ["crates/monitor-core", "crates/monitor-agent", "crates/monitorctl"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
# readme stays per-member, not inherited from workspace.package: an inherited
# relative path resolves against each member dir as ../../README.md and
# triggers the cargo package "path outside of the package" warning.
authors = ["houseme <housemecn@gmail.com>", "heihutu <heihutu@gmail.com>", "zhi22915 <qiuzgang@gmail.com>"]
repository = "https://github.com/houseme/service-watch"
# crates.io constraints: keywords <= 5 (lowercase); categories <= 5, official
# slugs only (strictly validated at publish time).
keywords = ["monitoring", "supervisor", "process", "health-check", "metrics"]
categories = ["development-tools", "command-line-utilities", "os", "network-programming", "hardware-support"]

[workspace.dependencies]
monitor-core = { path = "crates/monitor-core", version = "0.2.0" }
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "time",
    "sync",
    "macros",
    "signal",
    "process",
    "net",
    "io-util",
    "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tracing = "0.1"
url = { version = "2", features = ["serde"] }
async-trait = "0.1"
sysinfo = "0.40"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
libc = "0.2"
windows-sys = "0.61"
# F15 Windows Service form (declared only by monitor-agent). A virtual workspace
# manifest allows no [target.*] sections and optional deps can only be declared
# in member manifests — the version is centralized here, while target-gating and
# optional live in monitor-agent's own [target.'cfg(windows)'.dependencies]
# (same declaration style as monitor-core's windows-sys).
# Version verified 2026-11-11 (cargo search windows-service --registry crates-io -> 0.8.1).
windows-service = "0.8.1"

[profile.release]
lto = "thin"
strip = "symbols"
