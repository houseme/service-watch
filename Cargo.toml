[workspace]
resolver = "3"
members = ["crates/monitor-core", "crates/monitor-agent", "crates/monitorctl"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
# readme stays per-member, not inherited from workspace.package: an inherited
# relative path resolves against each member dir as ../../README.md and
# triggers the cargo package "path outside of the package" warning.
authors = ["houseme <housemecn@gmail.com>", "heihutu <heihutu@gmail.com>", "zhi22915 <qiuzgang@gmail.com>"]
repository = "https://github.com/houseme/service-watch"
# crates.io constraints: keywords <= 5 (lowercase); categories <= 5, official
# slugs only (strictly validated at publish time).
keywords = ["monitoring", "supervisor", "process", "health-check", "metrics"]
categories = ["development-tools", "command-line-utilities", "os", "network-programming", "hardware-support"]

[workspace.dependencies]
monitor-core = { path = "crates/monitor-core", version = "0.3.0" }
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "time",
    "sync",
    "macros",
    "signal",
    "process",
    "net",
    "io-util",
    "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tracing = "0.1"
url = { version = "2", features = ["serde"] }
async-trait = "0.1"
sysinfo = "0.40"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
axum = "0.8"
# F32 控制面 HTTPS (axum-server TLS acceptor;rustls provider 与 reqwest 同线)。
# 版本核对 2026-11-18 (cargo search axum-server -> 0.9.2,axum 0.8 兼容线)。
axum-server = { version = "0.9", features = ["tls-rustls"] }
# F38 mTLS:客户端 CA PEM 解析 (纯 Rust;control-http feature 门控)。
# 版本核对 2026-11-18 (cargo search rustls-pemfile -> 2.2.0)。
rustls-pemfile = "2"
# F38 mTLS:WebPkiClientVerifier / RootCertStore / ServerConfig 仅在 rustls
# crate 本体 (axum-server 0.9.2 / reqwest 0.13.5 / rustls-pemfile 2.2.0 均无
# 公开 re-export)。default-features = false + [std, tls12]:provider 经
# builder_with_provider 显式传入 (不 install_default),aws-lc-rs 由 axum-server
# tls-rustls / reqwest rustls feature 合并提供 —— 本声明不新增任何编译单元。
# 版本核对 2026-11-18 (Cargo.lock rustls 0.23.46，与 axum-server/reqwest 同线)。
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }

clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
libc = "0.2"
# F29 webhook HMAC 签名 (notify-webhook feature 门控;纯 Rust，无 C 依赖)。
# 版本核对 2026-11-18 (hmac 0.13.0 / sha2 0.11.1)。
hmac = "0.13.0"
sha2 = "0.11.1"
# F32 测试：自签 TLS 证书生成 (纯 Rust;Windows CI 无 openssl CLI，测试内生成)。
# 版本核对 2026-11-18 (cargo search rcgen -> 0.14.10)。
rcgen = "0.14"
windows-sys = "0.61"
# F15 Windows Service form (declared only by monitor-agent). A virtual workspace
# manifest allows no [target.*] sections and optional deps can only be declared
# in member manifests — the version is centralized here, while target-gating and
# optional live in monitor-agent's own [target.'cfg(windows)'.dependencies]
# (same declaration style as monitor-core's windows-sys).
# Version verified 2026-11-11 (cargo search windows-service --registry crates-io -> 0.8.1).
windows-service = "0.8.1"

[profile.release]
lto = "thin"
strip = "symbols"
