name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace --all-targets -- -D warnings

  constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 硬约束:工作区成员不得声明 rust-version;edition 2024;Apache-2.0(AGENT.md §5)
      - run: cargo metadata --format-version 1 | jq -e '[.packages[] | select(.source == null) | select(.rust_version != null)] | length == 0'
      - run: cargo metadata --format-version 1 | jq -e '[.packages[] | select(.source == null) | .edition] | unique == ["2024"]'
      - run: cargo metadata --format-version 1 | jq -e '[.packages[] | select(.source == null) | .license] | unique == ["Apache-2.0"]'

  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 镜像 2026-11-02 从 GitHub Actions 机队退役
        # ("configuration 'macos-14-arm64-us-default' is not supported"),
        # arm64 腿换现役 macos-15(核对 2026-11-18 actions/runner-images)。
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # reqwest 0.13 的 rustls feature 绑定 aws-lc-rs(无 ring 备选):
      # Windows 构建需 NASM(汇编)+ CMake(aws-lc-sys 构建链),见 README 平台支持。
      - if: runner.os == 'Windows'
        run: choco install -y nasm cmake
      - if: runner.os == 'Windows'
        run: echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $env:GITHUB_ENV
      - run: cargo test --workspace --features collect-deep-hardware
      - if: runner.os == 'Windows'
        # windows-service = agent 自身 SCM 形态(F15);monitor-core/scm-target
        # = 原生 Windows Service 目标恢复(RealScmOps 高层 API)。
        run: cargo test -p monitor-agent --features windows-service,collect-deep-hardware,monitor-core/scm-target

  cross-check:
    # DESIGN §6.5:本地/CI 交叉 check 仅覆盖无 C 依赖的 feature 集;
    # Windows 全量验证由上方 test job 的 windows runner 承担。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo check -p monitor-agent --target x86_64-pc-windows-msvc --no-default-features --features collect-sysinfo,collect-deep-hardware,windows-service
      # scm-target(原生 Windows Service 目标):RealScmOps 仅在此 feature 下编译
      # —— 无 CI 线时真实 SCM 高层 API 零编译覆盖(第六轮评审缺口,与 F15 同类)。
      - run: cargo check -p monitor-core --target x86_64-pc-windows-msvc --no-default-features --features collect-sysinfo,scm-target
      # 非 http-client 组合(F12 曾在此门控断裂:spool 误挂 http-client,第五轮评审 P2)
      - run: cargo check --workspace --no-default-features --features collect-sysinfo
      - run: cargo check --workspace --no-default-features --features collect-sysinfo,control-http
      - run: cargo check -p monitor-core --target aarch64-apple-darwin --no-default-features --features collect-sysinfo,collect-deep-hardware
      - run: cargo check -p monitor-core --target x86_64-apple-darwin --no-default-features --features collect-sysinfo,collect-deep-hardware
