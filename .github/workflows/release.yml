# 发布构建:tag 推送触发,四平台交叉产出二进制压缩包并创建 GitHub Release。
#
# 触发方式:
#   1. 把根 Cargo.toml [workspace.package].version 改为目标版本(verify-tag 强制一致)
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# 矩阵(与 ci.yml 平台口径一致):
#   - x86_64-unknown-linux-gnu / aarch64-apple-darwin / x86_64-apple-darwin:
#     默认 feature + collect-deep-hardware(Linux hwmon、macOS AppleSMC 深度采集;
#     发布二进制统一带上,省去用户按需重编)。
#   - x86_64-pc-windows-msvc:额外启用 windows-service(F15 agent 自身 SCM 形态)
#     与 monitor-core/scm-target(原生 Windows Service 目标恢复);TLS 栈为
#     rustls + aws-lc-rs(reqwest 0.13 无 ring 备选),需 NASM + CMake。
#
# 扩展位:Linux aarch64 需 cross(ghcr.io/cross-rs)+ 目标侧 gcc/perl,暂未纳入。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create 上传产物

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    # tag 必须与 workspace 版本一致:产物 --version 取自 Cargo.toml,
    # 不一致时先改根 Cargo.toml 再打 tag,避免 v0.2.0 的包内报 0.1.0。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          ws="$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.source == null and .name == "monitor-agent") | .version')"
          if [ "$tag" != "$ws" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 workspace 版本 ${ws} 不一致 —— 先把根 Cargo.toml [workspace.package].version 改为 ${tag} 再打 tag"
            exit 1
          fi
          echo "tag 校验通过:${GITHUB_REF_NAME} == ${ws}"

  build:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            agent_features: collect-deep-hardware
          # macOS 包暂缓:runner 池连续 10h+ 枯竭;交叉链三方案
          # (zigbuild/container+SDK13.3)均止于链接期/SDK 依赖,教训链见
          # service-watch-review-round7 记忆 1–7 环。待 macOS runner 恢复后
          # 恢复原生构建 job(此前版本见 git 历史 8a42bfa 之前的矩阵)。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            agent_features: windows-service,monitor-core/scm-target,collect-deep-hardware
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v4
      # container 内不用 dtolnay action(镜像自带 rustup 但 --force-non-host 参数
      # 不被旧 rustup 认,且旧 cargo 不认 manifest 新语法):显式 rustup update stable
      - if: matrix.container == null
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.container != null
        run: |
          # 镜像预装 cargo 1.79 不认 edition2024;rustup update 后旧路径可能仍优先,
          # 显式 default + PATH 校验(失败即早退,便于诊断)
          rustup update stable --force-non-host 2>/dev/null || rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
          echo "CARGO_HOME=$(dirname $(dirname $(command -v cargo)))" >> "$GITHUB_ENV" || true
          cargo --version && rustc --version
      - if: matrix.container != null
        run: |
          # P3 防御:rustup default 后确认 cargo ≥1.85(edition2024)
          v=$(cargo --version | grep -oE '[0-9]+\.[0-9]+')
          major=${v%%.*}; minor=${v#*.}
          echo "cargo $v"
          if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 85 ]; }; then
            echo "::error::container cargo $v < 1.85 (edition2024 required); check image tag"
            exit 1
          fi
      # aws-lc-sys 构建链依赖;CMake 4 移除 <3.5 兼容,需显式放行(与 ci.yml 同口径)
      - if: runner.os == 'Windows'
        run: choco install -y nasm cmake
      - if: runner.os == 'Windows'
        run: echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $env:GITHUB_ENV
      # macOS 交叉 job:自带 macOS SDK 的 cargo-zigbuild 镜像(框架链接必需)
      - name: build
        shell: bash
        run: |
          # macOS 交叉 job(在自带 macOS SDK 的 container 内):zigbuild +
          # --no-default-features。镜像自带 SDK 较老,sysinfo 引用的
          # _kIOMainPortDefault 需 macOS 12+ IOKit 符号 → 下载 macOS 13 SDK 并
          # SDKROOT 指向(社区标准做法;官方 Apple 下载需认证,这里用
          # phracker/MacOSX-SDKs 公开镜像)。
          if [[ "${{ matrix.target }}" == *apple-darwin* ]]; then
            export MACOSX_DEPLOYMENT_TARGET=12.0
            if [ ! -d "$HOME/MacOSX13.sdk/usr/include" ]; then
              curl -sL --retry 5 https://github.com/joseluisq/macosx-sdks/releases/download/13.3/MacOSX13.3.sdk.tar.xz | tar -xJ -C "$HOME"
              mv "$HOME/MacOSX13.3.sdk" "$HOME/MacOSX13.sdk"
            fi
            export SDKROOT="$HOME/MacOSX13.sdk"
            cargo zigbuild --release -p monitor-agent --target ${{ matrix.target }} --no-default-features --features "${{ matrix.agent_features }}"
          else
            cargo build --release -p monitor-agent --target ${{ matrix.target }} --features "${{ matrix.agent_features }}"
          fi
          if [[ "${{ matrix.target }}" == *apple-darwin* ]]; then
            cargo zigbuild --release -p monitorctl --target ${{ matrix.target }} --no-default-features --features collect-sysinfo
          else
            cargo build --release -p monitorctl --target ${{ matrix.target }} --features collect-deep-hardware
          fi
      - name: stage
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="service-watch-${version}-${{ matrix.target }}"
          mkdir -p "dist/${pkg}"
          bin="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "${bin}/monitor-agent.exe" "${bin}/monitorctl.exe" "dist/${pkg}/"
            cp docs/deploy/windows/install-service.ps1 "dist/${pkg}/"
          else
            cp "${bin}/monitor-agent" "${bin}/monitorctl" "dist/${pkg}/"
            mkdir -p "dist/${pkg}/deploy"
            cp docs/deploy/systemd/service-watch.service "dist/${pkg}/deploy/"
            cp docs/deploy/launchd/com.houseme.service-watch.plist "dist/${pkg}/deploy/"
          fi
          cp config/config.example.toml "dist/${pkg}/"
          echo "pkg=${pkg}" >> "$GITHUB_ENV"
      - name: package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
      - name: package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${env:pkg}" -DestinationPath "dist/${env:pkg}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
      # 重跑工作流时 tag 已存在:改走 upload --clobber 覆盖产物
      - name: create or update release
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "service-watch ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
