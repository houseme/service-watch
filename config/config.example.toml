# service-watch configuration reference — maps 1:1 to the DESIGN.md §4 schema (2026-11-10)
# Validate with: monitor-agent --check-config <this file>

[agent]
data_dir = "./data"                       # journal directory (incidents / restart events / Fatal latch)
journal_max_size = 10485760               # journal rotation threshold in bytes (default 10 MiB; 0 = disable rotation; keeps a single journal.1.jsonl generation) — F24, reserved: parsed & validated only, rotation wiring pending

[log]
json = false                              # true = structured JSON logs

[control]                                 # control plane (monitorctl depends on it)
enabled = true
listen = "127.0.0.1:9170"                 # loopback only; switching to a non-loopback address is at your own risk
# token = "change-me"                     # optional Bearer token — F23, reserved: parsed & validated only, enforcement pending; once enforced every endpoint except /health requires Authorization, and monitorctl takes --token or SERVICE_WATCH_TOKEN

[collect]
interval = "5s"                           # global collection interval (hardware/process snapshot)

[alert]
webhook_url = ""                          # empty = no delivery (events still go to journal/logs)
webhook_format = "json"                   # json = AlertEvent as-is; slack = {"text": summary}
timeout = "10s"                           # per-delivery timeout
retries = 3                               # exponential-backoff retries (start 1s, x2, capped at 10s)
renotify_interval = "15m"                 # re-notify interval while the same incident stays open
failure_threshold = 3                     # consecutive failures -> Critical
success_threshold = 2                     # consecutive successes -> recovery (Resolve)
flap_window = "30m"                       # flap detection window
flap_threshold = 5                        # open/close count within the window that triggers suppression
deadman_url = ""                          # optional heartbeat POST; failures are logged only

# Per-target alert routing — F26, reserved: parsed & validated only, dispatch pending.
# Sequential first-prefix match on target names; no match falls back to webhook_url above.
# [[alert.routes]]
# match = "edge-*"
# url = "https://hooks.example.com/edge"
# format = "slack"                        # json | slack

[metrics]                                 # periodic metrics push (POST JSON MetricsReport; success = 2xx)
enabled = false
url = ""                                  # empty = GET /metrics exposure only; single attempt, no retry, a failure is overwritten next round
interval = "60s"
timeout = "10s"                           # per-push timeout

# ============ Check targets (monitoring + alerting only) ============

[[check]]
name = "example-http"
kind = "http"                             # http | tcp | process
url = "http://127.0.0.1:8080/healthz"     # required for http
expected_status = "200-299"               # default 200-299 (inclusive)
interval = "10s"                          # must be > timeout (enforced by config validation)
timeout = "5s"

# [[check]]
# name = "example-tcp"
# kind = "tcp"
# addr = "127.0.0.1:5432"
# interval = "10s"
# timeout = "5s"

# [[check]]
# name = "example-process"
# kind = "process"
# process = "my-app"                      # configured service/watch name or "pid:1234"
# cpu_threshold = 90.0                    # at least one of cpu_threshold / mem_threshold_mb
# mem_threshold_mb = 1024
# interval = "15s"
# timeout = "5s"

# ============ Supervised targets (agent keeps them alive) ============

[[service]]
name = "example-app"
command = "/usr/local/bin/example-app"    # required for supervise; daemonizing targets are forbidden
args = ["--port", "8080"]
workdir = "/srv/example"
env = { RUST_LOG = "info" }
# depends_on = ["db"]                     # F20 startup orchestration: start only after every dependency is Running
                                          # (references must exist; self-dependency and cycles are forbidden)
# console = false                         # Windows: true = start in a new process group and attempt CTRL_BREAK (not guaranteed)

[service.restart]                         # every field has a default; the whole section may be omitted
min_uptime = "10s"                        # uptime below this counts as a crash-loop suspect
backoff_initial = "1s"
backoff_max = "60s"
max_restarts = 5                          # max automatic restarts within the sliding window
restart_window = "10m"
stop_grace = "15s"                        # graceful -> force-kill escalation deadline
startup_grace = "30s"                     # grace period: failures during it do not enter the state machine
confirmations = 2                         # confirmations before a health failure triggers recovery
hung_action = "restart"                   # restart | activate

# [service.activate]                      # required when hung_action = "activate"
# command = "/usr/local/bin/kick-app"     # command and url are mutually exclusive
# timeout = "10s"                         # activation hook timeout
# verify_for = "30s"                      # observation window after activation; still failing -> Restart

# ============ Attach targets (monitor only, never killed/restarted) ============

# [[watch]]
# name = "systemd-nginx"
# pidfile = "/run/nginx.pid"              # or pid = 1234
