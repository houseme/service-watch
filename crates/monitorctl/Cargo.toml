[package]
name = "monitorctl"
description = "service-watch control CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/monitorctl"
keywords.workspace = true
categories.workspace = true

[features]
collect-deep-hardware = ["monitor-core/collect-deep-hardware"]

[dependencies]
monitor-core = { workspace = true, default-features = false, features = ["collect-sysinfo"] }
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
